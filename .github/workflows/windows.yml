name: Windows

on:
  push:
    branches: [ 'master', '2.x', '3.x' ]
  pull_request:
    branches: [ '*' ]

jobs:
  tests:
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        php: [ '8.1' ]
        setup: [ 'stable' ]

    steps:
      - uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: :sockets, json
          tools: composer:v2
          coverage: none

      - name: Cache library packages
        id: composer-cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ matrix.php }}-${{ matrix.setup }}-${{ hashFiles('composer.json') }}

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress --prefer-${{ matrix.setup }}

      - name: Run test suite
        run: composer test
